<!-- Must run before widget.js: Calendly reads data-url once, when it initialises.
     Everything here is non-personal: only the 5 UTM params go to Calendly, and
     the dataLayer events carry the landing slug, never anything from the booking. -->
<script>
(function () {
  "use strict";
  window.dataLayer = window.dataLayer || [];

  var params = new URLSearchParams(location.search);
  var src = params.get("src");
  var landingSource = src && /^[A-Za-z0-9_-]{1,64}$/.test(src) ? src : "direct";

  var widget = document.querySelector(".calendly-inline-widget");
  if (widget) {
    var url = new URL(widget.getAttribute("data-url"));
    ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"].forEach(function (key) {
      var value = params.get(key);
      if (value) url.searchParams.set(key, value);
    });
    widget.setAttribute("data-url", url.toString());
  }

  var EVENTS = {
    "calendly.event_type_viewed": "calendly_view",
    "calendly.date_and_time_selected": "calendly_date_selected",
    "calendly.event_scheduled": "calendly_booking_confirmed"
  };
  var pushed = {};
  window.addEventListener("message", function (e) {
    if (e.origin !== "https://calendly.com") return;
    var name = e.data && e.data.event;
    if (typeof name !== "string" || name.indexOf("calendly.") !== 0) return;
    var event = EVENTS[name];
    if (!event || pushed[event]) return;
    pushed[event] = true;
    window.dataLayer.push({ event: event, landing_source: landingSource });
    if (event === "calendly_view") {
      var box = document.querySelector(".reserve-calendar");
      if (box) box.classList.add("is-loaded");
    }
  });

  var back = document.querySelector("[data-reserve-back]");
  if (back) {
    if (landingSource !== "direct") back.setAttribute("href", "/" + landingSource + "/");
    back.addEventListener("click", function (e) {
      var sameSiteReferrer = false;
      try { sameSiteReferrer = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (err) {}
      if (sameSiteReferrer && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });
  }
})();
</script>
